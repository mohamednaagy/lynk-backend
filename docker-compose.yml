# Shared configuration for volume mounts - using named volume for logs
x-app-volumes: &app-volumes
  volumes:
    - app_logs:/var/www/html/storage/logs

# Shared network configuration - use host network to access Redis/MySQL on host
x-host-network: &host-network
  network_mode: host

# Shared Nightwatch environment configuration
# Note: Using 127.0.0.1:2407 instead of nightwatch-agent:2407 due to host networking
x-nightwatch-env: &nightwatch-env
  environment:
    - NIGHTWATCH_ENABLED=true
    - NIGHTWATCH_TOKEN=${NIGHTWATCH_TOKEN}
    - NIGHTWATCH_REQUEST_SAMPLE_RATE=${NIGHTWATCH_REQUEST_SAMPLE_RATE:-0.1}
    - NIGHTWATCH_COMMAND_SAMPLE_RATE=${NIGHTWATCH_COMMAND_SAMPLE_RATE:-1.0}
    - NIGHTWATCH_EXCEPTION_SAMPLE_RATE=${NIGHTWATCH_EXCEPTION_SAMPLE_RATE:-1.0}
    - NIGHTWATCH_INGEST_URI=127.0.0.1:2407

# Profile Usage:
# - Production deployment: --profile web --profile group1 --profile group2 --profile group3 --profile dev-services
# - Local development: --profile local (includes nginx, redis, mysql, phpmyadmin, mailhog)
# - Dev infrastructure only: --profile dev-services (redis, mailhog)
# - Observability: --profile observability (nightwatch)

services:
  # ============================================================================
  # WEB PROFILE - PHP-FPM Application
  # ============================================================================
  app:
    profiles: ["web"]
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    image: app-php-fpm:latest
    container_name: lynk-backend-app
    working_dir: /var/www/html
    restart: unless-stopped
    <<: [*app-volumes, *host-network, *nightwatch-env]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # LOCAL PROFILE - Development Infrastructure
  # Note: redis and mailhog are also available via 'dev-services' profile
  # ============================================================================
  nginx:
    profiles: ["local"]
    image: nginx:alpine
    container_name: lynk-backend-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    profiles: ["local", "dev-services"]
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    profiles: ["local"]
    image: mysql/mysql-server:8.0
    container_name: lynk-backend-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - .docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: --log-bin-trust-function-creators=1

  phpmyadmin:
    profiles: ["local"]
    image: phpmyadmin/phpmyadmin
    container_name: laravel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1G
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailhog:
    profiles: ["local", "dev-services"]
    image: mailhog/mailhog
    container_name: laravel-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3

  nightwatch:
    profiles: ["observability"]
    image: app-php-fpm:latest
    container_name: laravel-nightwatch
    working_dir: /var/www/html
    restart: unless-stopped
    <<: [*app-volumes, *host-network, *nightwatch-env]
    command: php artisan nightwatch:agent --verbose --listen-on=0.0.0.0:2407
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
