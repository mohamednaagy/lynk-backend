# Docker Compose configuration with encrypted environment support
#
# IMPORTANT: All builds require encrypted environment content and encryption key.
#
# To build with encrypted environment:
#   1. Create encrypted content: php artisan env:encrypt
#   2. Set environment variables:
#      export ENCRYPTED_ENV_CONTENT="$(cat .env.encrypted)"
#      export LARAVEL_ENV_ENCRYPTION_KEY="your-32-char-key"
#   3. Build and run:
#      docker-compose build
#      docker-compose --profile web up -d
#
# See docker.md Section g) for detailed documentation

# ============================================================================
# HOST CONNECTIVITY - Allow containers to connect to host services
# ============================================================================
x-extra-hosts: &default-extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ============================================================================
  # WEB PROFILE - PHP-FPM Application
  # ============================================================================
  app:
    <<: *default-extra-hosts
    profiles: ["web"]
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    image: app-php-fpm:latest
    container_name: lynk-laravel-app
    working_dir: /var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

  # ============================================================================
  # LOCAL PROFILE - Development Infrastructure
  # ============================================================================
  nginx:
    profiles: ["local"]
    image: nginx:alpine
    container_name: lynk-laravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

  redis:
    profiles: ["local"]
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

  mysql:
    profiles: ["local"]
    image: mysql/mysql-server:8.0
    container_name: lynk-laravel-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - .docker/mysql:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: --log-bin-trust-function-creators=1

  phpmyadmin:
    profiles: ["local"]
    image: phpmyadmin/phpmyadmin
    container_name: laravel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1G
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

  mailhog:
    profiles: ["local"]
    image: mailhog/mailhog
    container_name: laravel-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

  nightwatch:
    <<: *default-extra-hosts
    profiles: ["observability"]
    image: app-php-fpm:latest
    container_name: laravel-nightwatch
    working_dir: /var/www/html
    restart: unless-stopped
    command: tail -f /dev/null
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
