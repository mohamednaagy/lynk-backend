services:
  nightwatch:
    image: app-php-fpm:latest
    container_name: laravel-nightwatch
    working_dir: /var/www/html
    restart: unless-stopped
    env_file:
      - ../../.env
    command: tail -f /dev/null
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

networks:
  laravel:
