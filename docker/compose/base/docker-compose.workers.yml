# Base worker definitions
# This file defines the common structure for all queue workers
# Individual worker groups extend these definitions

services:
  # Template for standard worker (can be replicated)
  x-worker-template: &worker-template
    image: app-php-fpm:latest
    working_dir: /var/www/html
    restart: unless-stopped
    env_file:
      - ../../../.env
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel
    # Resource limits (can be overridden per worker)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Template for lightweight worker (logging, notifications)
  x-worker-light-template: &worker-light-template
    <<: *worker-template
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Template for critical worker (NO replication - financial operations)
  x-worker-critical-template: &worker-critical-template
    <<: *worker-template
    deploy:
      replicas: 1  # NEVER replicate critical financial workers
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  laravel:
    driver: bridge
