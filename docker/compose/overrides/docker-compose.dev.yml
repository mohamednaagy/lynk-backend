# Development/Staging Override
# Single server deployment with all workers (1 replica each)

services:
  app:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # All workers run with 1 replica in dev/staging
  worker-local-market:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=local_market,local_market_states,local_market_process
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  worker-order-initiation:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=local_market_order_initiation
    deploy:
      replicas: 1

  worker-buy-commodities:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=buy_commodities_local_market_orders
    deploy:
      replicas: 1

  worker-complete-commodities:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=complete_commodities_purchased_local_market
    deploy:
      replicas: 1

  worker-default:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=3 --queue=default,notifications,local_market_webhooks,create_trader_orders,local_market_eligible_quantities
    deploy:
      replicas: 1

  worker-trader-initiation:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=trader_order_initiation
    deploy:
      replicas: 1

  worker-hold-units:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=3 --backoff=120 --queue=hold_eligible_units_local_market_orders
    deploy:
      replicas: 1

  worker-settlement:
    <<: *worker-critical-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=local_market_commodities_settlement
    # CRITICAL: Settlement worker must never be replicated (financial transactions)

  worker-inventory-logging:
    <<: *worker-light-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=local_market_order_inventories_units_logging
    deploy:
      replicas: 1

  worker-refresh-eligibilities:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=refresh_eligibilities
    deploy:
      replicas: 1

  worker-order-fees:
    <<: *worker-critical-template
    command: php artisan queue:work redis --verbose --tries=5 --queue=apply_order_fees
    # CRITICAL: Fees worker must never be replicated (charging fees)

  worker-external-integrations:
    <<: *worker-template
    command: php artisan queue:work redis --verbose --tries=3 --backoff=120 --queue=bursam,unit-inventory,expire_trader_order
    deploy:
      replicas: 1

networks:
  laravel:
    driver: bridge
