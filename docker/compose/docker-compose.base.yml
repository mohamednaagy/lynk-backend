version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: docker/laravel/Dockerfile
    image: app-php-fpm:latest
    container_name: laravel-app
    working_dir: /var/www/html
    restart: unless-stopped
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
