name: deploy on dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev
env:
  ENVIRONMENT: dev

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  
jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        id: install-ssh-key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: pulling and build code
        id: pull-and-build
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} \
           "cd /var/www/lynk-backend/ && \
            git pull origin dev && \
            composer install --ignore-platform-reqs && \
            sudo php artisan migrate && \
            sudo php artisan structure:clear && \
            sudo php artisan structure:discover
            sudo supervisorctl stop all && \
            sudo supervisorctl start all"

      - name: set pr url
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        id: pr-url
        uses: kceb/pull-request-url-action@v1
        with:
          github-oauth-token: ${{ secrets.GB_OAUTH_TOKEN }}

      - name: print info
        if: always()
        run: |
          echo "Repository Name: $GITHUB_REPOSITORY"
          echo "Branch Name: $GITHUB_REF"
          echo "pr-url: ${{ steps.pr-url.outputs.url }}"
          echo "Execution Time: $(date)"
          echo "Workflow Status: ${{ job.status }}"

          curl --insecure -X POST -H 'Content-type: application/json' --data '{"text":"Repository Name: '"$GITHUB_REPOSITORY"'\nBranch Name: '"$GITHUB_REF"'\nExecution Time: '"$(date)"'\nWorkflow Status: '"${{ job.status }}"'\n pull request URL: '"${{ steps.pr-url.outputs.url }}"'"}'  ${{ secrets.SLACK_HOOK_URL }}

  test:
    name: 🧪 Regression Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🔍 Debug SSH User
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            echo 'Current user:' && whoami &&
            echo 'Home directory:' && echo \$HOME &&
            echo 'Looking for automation repo...' &&
            sudo find /home -name 'lynk-backend-automation' -type d 2>/dev/null &&
            echo 'Permissions on /home:' && ls -la /home/
          "

      - name: 🔄 Update Automation Repo
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/lynksa/lynk-backend-automation.git &&
              git fetch origin main &&
              git reset --hard origin/main &&
              echo \"Updated to commit: \$(git rev-parse HEAD)\"
            '
          "

      - name: 🧹 Prepare Test Environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              rm -rf allure-results merged-allure-results allure-report &&
              mkdir -p allure-results/admin allure-results/lender allure-results/supplier merged-allure-results
            '
          "

      - name: 🧪 Run Regression Tests
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              docker-compose down --remove-orphans 2>/dev/null || true &&
              docker-compose build --no-cache &&
              docker-compose up -d &&
              echo \"Waiting for all test containers to complete...\" &&
              docker wait test-admin test-lender test-supplier || true &&
              echo \"All containers finished\" &&
              docker-compose logs &&
              docker-compose down
            '
          "
        continue-on-error: true

      - name: 🔧 Fix Permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo chown -R ubuntu:ubuntu /home/ubuntu/lynk-backend-automation/allure-results /home/ubuntu/lynk-backend-automation/allure-report /home/ubuntu/lynk-backend-automation/merged-allure-results 2>/dev/null || true
          "

      - name: 📊 Merge Allure Results
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              mkdir -p merged-allure-results &&
              cp -R allure-results/admin/* merged-allure-results/ 2>/dev/null || true &&
              cp -R allure-results/lender/* merged-allure-results/ 2>/dev/null || true &&
              cp -R allure-results/supplier/* merged-allure-results/ 2>/dev/null || true
            '
          "

      - name: 📈 Generate Allure Report
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              allure generate merged-allure-results -o allure-report --clean
            '
          "

      - name: 📥 Download Allure Report
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              tar -czf /tmp/allure-report.tar.gz allure-report merged-allure-results
            '
            sudo chmod 644 /tmp/allure-report.tar.gz
          "
          scp -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }}:/tmp/allure-report.tar.gz ./allure-report.tar.gz
          tar -xzf allure-report.tar.gz

      - name: 📊 Extract Test Results
        id: test-results
        run: |
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          if [ -d "merged-allure-results" ]; then
            for f in merged-allure-results/*-result.json; do
              if [ -f "$f" ]; then
                status=$(jq -r '.status // "unknown"' "$f" 2>/dev/null)
                case "$status" in
                  "passed") PASSED=$((PASSED + 1)) ;;
                  "failed"|"broken") FAILED=$((FAILED + 1)) ;;
                  "skipped") SKIPPED=$((SKIPPED + 1)) ;;
                esac
              fi
            done
            TOTAL=$((PASSED + FAILED + SKIPPED))
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

          echo "Test counts: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"

      - name: 📤 Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-allure-results
          path: merged-allure-results/
          retention-days: 30

      - name: 📤 Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-allure-report
          path: allure-report/
          retention-days: 30

      - name: Set link vars
        id: links
        run: |
          # GitHub Pages URLs
          BASE_URL="https://${{ github.repository_owner }}.github.io/lynk-backend"
          echo "THIS_RUN_URL=${BASE_URL}/deploy-validation/${{ github.run_number }}/" >> $GITHUB_OUTPUT
          echo "LATEST_URL=${BASE_URL}/deploy-validation/latest/" >> $GITHUB_OUTPUT
          echo "DASHBOARD_URL=${BASE_URL}/deploy-validation/" >> $GITHUB_OUTPUT

          echo "📊 Generated URLs:"
          echo "  - This Run: ${BASE_URL}/deploy-validation/${{ github.run_number }}/"
          echo "  - Latest: ${BASE_URL}/deploy-validation/latest/"
          echo "  - Dashboard: ${BASE_URL}/deploy-validation/"

      - name: 🌐 Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: deploy-validation/${{ github.run_number }}
          keep_files: true

      - name: 🌐 Deploy Latest Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: deploy-validation/latest
          keep_files: true

      - name: Create dashboard
        run: |
          # Install jq
          sudo apt-get update && sudo apt-get install -y jq

          # Checkout gh-pages to get existing dashboard data
          git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-checkout || mkdir -p gh-pages-checkout

          # Create data directory for deploy-validation
          mkdir -p dashboard-deploy/deploy-validation/data

          # Initialize or update runs.json
          if [[ -f gh-pages-checkout/deploy-validation/data/runs.json ]]; then
            cp gh-pages-checkout/deploy-validation/data/runs.json dashboard-deploy/deploy-validation/data/runs.json
          else
            echo "[]" > dashboard-deploy/deploy-validation/data/runs.json
          fi

          # Add current run to metadata
          jq --arg run "${{ github.run_number }}" \
             --arg branch "${{ github.ref_name }}" \
             --arg status "${{ steps.test-results.outputs.status }}" \
             --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg total "${{ steps.test-results.outputs.total }}" \
             --arg passed "${{ steps.test-results.outputs.passed }}" \
             --arg failed "${{ steps.test-results.outputs.failed }}" \
             '. + [{"run": $run, "branch": $branch, "status": $status, "timestamp": $timestamp, "total": $total|tonumber, "passed": $passed|tonumber, "failed": $failed|tonumber}] | unique_by(.run) | sort_by(.run | tonumber) | reverse | .[0:50]' \
             dashboard-deploy/deploy-validation/data/runs.json > dashboard-deploy/deploy-validation/data/runs_new.json
          mv dashboard-deploy/deploy-validation/data/runs_new.json dashboard-deploy/deploy-validation/data/runs.json

          # Create deploy-validation-specific dashboard HTML
          cat > dashboard-deploy/deploy-validation/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Deploy Validation - Lynk Test Reports</title>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                      background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                  }
                  .header {
                      background: white;
                      border-radius: 10px;
                      padding: 30px;
                      margin-bottom: 30px;
                      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                  }
                  h1 {
                      color: #2d3748;
                      margin-bottom: 10px;
                  }
                  .quick-links {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }
                  .quick-link {
                      background: white;
                      padding: 20px;
                      border-radius: 10px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                      text-decoration: none;
                      color: #2d3748;
                      transition: transform 0.2s;
                  }
                  .quick-link:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                  }
                  .runs-container {
                      background: white;
                      border-radius: 10px;
                      padding: 30px;
                      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-top: 20px;
                  }
                  th {
                      background: #f7fafc;
                      padding: 12px;
                      text-align: left;
                      border-bottom: 2px solid #e2e8f0;
                  }
                  td {
                      padding: 12px;
                      border-bottom: 1px solid #e2e8f0;
                  }
                  .status-success, .status-✅ { color: #22543d; background: #c6f6d5; padding: 4px 8px; border-radius: 4px; }
                  .status-failure, .status-❌ { color: #742a2a; background: #fed7d7; padding: 4px 8px; border-radius: 4px; }
                  .view-btn {
                      background: #1a202c;
                      color: white;
                      padding: 8px 16px;
                      border-radius: 6px;
                      text-decoration: none;
                      display: inline-block;
                  }
                  .view-btn:hover {
                      background: #2d3748;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🚀 Deploy Validation Reports</h1>
                      <p>Post-Deploy Regression Testing - Test Execution Dashboard</p>
                  </div>

                  <div class="quick-links">
                      <a href="latest/" class="quick-link">
                          <h3>📊 Latest Report</h3>
                          <p>View the most recent test execution</p>
                      </a>
                      <a href="../" class="quick-link">
                          <h3>🏠 All Workflows</h3>
                          <p>Back to main dashboard</p>
                      </a>
                  </div>

                  <div class="runs-container">
                      <h2>📜 Deploy Validation Run History</h2>
                      <table>
                          <thead>
                              <tr>
                                  <th>Run #</th>
                                  <th>Status</th>
                                  <th>Branch</th>
                                  <th>Tests</th>
                                  <th>Date</th>
                                  <th>Action</th>
                              </tr>
                          </thead>
                          <tbody id="runs-table">
                              <!-- Will be populated by JavaScript -->
                          </tbody>
                      </table>
                  </div>
              </div>

              <script>
                  // Load and display runs
                  fetch('data/runs.json')
                      .then(response => response.json())
                      .then(runs => {
                          const tbody = document.getElementById('runs-table');
                          runs.forEach(run => {
                              const row = document.createElement('tr');
                              const testSummary = `${run.passed}✅ / ${run.failed}❌ / ${run.total} total`;
                              const statusClass = run.status.includes('PASSED') ? 'status-success' : 'status-failure';
                              row.innerHTML = `
                                  <td><strong>#${run.run}</strong></td>
                                  <td><span class="${statusClass}">${run.status}</span></td>
                                  <td>${run.branch}</td>
                                  <td>${testSummary}</td>
                                  <td>${new Date(run.timestamp).toLocaleString()}</td>
                                  <td><a href="${run.run}/" class="view-btn">View Report</a></td>
                              `;
                              tbody.appendChild(row);
                          });
                      })
                      .catch(error => {
                          console.error('Error loading runs:', error);
                          document.getElementById('runs-table').innerHTML =
                              '<tr><td colspan="6">No historical data available yet</td></tr>';
                      });
              </script>
          </body>
          </html>
          HTMLEOF

          echo "✅ Deploy validation dashboard created"
          ls -la dashboard-deploy/

      - name: Deploy Dashboard
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard-deploy
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true

      - name: 🧹 Cleanup Remote
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            sudo -u ubuntu bash -c '
              cd /home/ubuntu/lynk-backend-automation &&
              docker-compose down --remove-orphans 2>/dev/null || true
            '
            sudo rm -f /tmp/allure-report.tar.gz
          "

      - name: 📢 Send Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "${{ steps.test-results.outputs.emoji }} Deploy Validation - Run #${{ github.run_number }}",
              "attachments": [
                {
                  "color": "${{ steps.test-results.outputs.color }}",
                  "title": "🚀 Deploy Validation Test Results",
                  "title_link": "${{ steps.links.outputs.THIS_RUN_URL }}",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "${{ steps.test-results.outputs.status }}",
                      "short": true
                    },
                    {
                      "title": "Test Summary",
                      "value": "Total: ${{ steps.test-results.outputs.total }}\n✅ Passed: ${{ steps.test-results.outputs.passed }}\n❌ Failed: ${{ steps.test-results.outputs.failed }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Triggered By",
                      "value": "${{ github.actor }}",
                      "short": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "button",
                      "text": "📊 This Run (#${{ github.run_number }})",
                      "url": "${{ steps.links.outputs.THIS_RUN_URL }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": "📈 Latest Report",
                      "url": "${{ steps.links.outputs.LATEST_URL }}"
                    },
                    {
                      "type": "button",
                      "text": "🔧 Workflow Details",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ],
                  "footer": "Lynk Backend • Deploy Validation"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📝 Create GitHub Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Validation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.test-results.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total | ${{ steps.test-results.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ steps.test-results.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ steps.test-results.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **This Run (#${{ github.run_number }}):** [View Report](${{ steps.links.outputs.THIS_RUN_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Results:** [View Latest](${{ steps.links.outputs.LATEST_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **All Runs:** [View Dashboard](${{ steps.links.outputs.DASHBOARD_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
