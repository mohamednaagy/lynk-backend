name: Deploy to Dev (Docker)

on:
    workflow_dispatch:
    push:
        branches:
            - dev

concurrency:
    group: deploy-dev-docker
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-latest
        environment: development
        outputs:
            servers: ${{ steps.set-servers.outputs.servers }}
            commit_hash: ${{ steps.commit.outputs.short_sha }}
            start_ts: ${{ steps.timestamp.outputs.start_ts }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Capture workflow start time
              id: timestamp
              run: |
                  START_TS=$(date +%s)
                  echo "start_ts=${START_TS}" >> $GITHUB_OUTPUT
                  echo "Workflow started at: $(date -d @${START_TS} +"%Y-%m-%d %H:%M:%S")"

            - name: Extract commit hash
              id: commit
              run: |
                  SHORT_SHA=$(git rev-parse --short=8 HEAD)
                  echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
                  echo "Image will be tagged as: app-php-fpm:${SHORT_SHA}"

            - name: Set server IPs from environment variable
              id: set-servers
              env:
                  SERVERS_JSON: ${{ vars.DEPLOYMENT_SERVER_IPS }}
              run: |
                  # Debug: Show what we're getting
                  echo "Raw value from vars.DEPLOYMENT_SERVER_IPS:"
                  echo "$SERVERS_JSON"
                  echo "---"

                  # Use env variable to avoid bash quote interpretation
                  echo "servers=$SERVERS_JSON" >> $GITHUB_OUTPUT

    build:
        needs: setup
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create .env file from GitHub secrets and variables
              run: |
                  # Create .env file from GitHub environment secrets and variables
                  cat > .env.build << 'ENVEOF'
                  # Application Configuration
                  APP_NAME=${{ vars.APP_NAME }}
                  APP_ENV=${{ vars.APP_ENV }}
                  APP_KEY=${{ vars.APP_KEY }}
                  APP_DEBUG=${{ vars.APP_DEBUG }}
                  APP_URL=${{ vars.APP_URL }}

                  # Logging
                  LOG_CHANNEL=${{ vars.LOG_CHANNEL }}
                  LOG_DEPRECATIONS_CHANNEL=${{ vars.LOG_DEPRECATIONS_CHANNEL }}
                  LOG_LEVEL=${{ vars.LOG_LEVEL }}

                  # Database Configuration
                  DB_CONNECTION=${{ vars.DB_CONNECTION }}
                  DB_HOST=${{ vars.DB_HOST }}
                  DB_PORT=${{ vars.DB_PORT }}
                  DB_DATABASE=${{ vars.DB_DATABASE }}
                  DB_USERNAME=${{ vars.DB_USERNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}

                  # Wallet Database
                  WALLET_DB_HOST=${{ vars.WALLET_DB_HOST }}
                  WALLET_DB_PORT=${{ vars.WALLET_DB_PORT }}
                  WALLET_DB_DATABASE=${{ vars.WALLET_DB_DATABASE }}
                  WALLET_DB_USERNAME=${{ vars.WALLET_DB_USERNAME }}
                  WALLET_DB_PASSWORD=${{ secrets.WALLET_DB_PASSWORD }}

                  # Broadcasting & Queue
                  BROADCAST_DRIVER=${{ vars.BROADCAST_DRIVER }}
                  CACHE_DRIVER=${{ vars.CACHE_DRIVER }}
                  FILESYSTEM_DISK=${{ vars.FILESYSTEM_DISK }}
                  QUEUE_CONNECTION=${{ vars.QUEUE_CONNECTION }}
                  SESSION_DRIVER=${{ vars.SESSION_DRIVER }}
                  SESSION_LIFETIME=${{ vars.SESSION_LIFETIME }}

                  # Memcached Configuration
                  MEMCACHED_HOST=${{ vars.MEMCACHED_HOST }}

                  # Redis Configuration
                  REDIS_HOST=${{ vars.REDIS_HOST }}
                  REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                  REDIS_PORT=${{ vars.REDIS_PORT }}

                  # Mail Configuration
                  MAIL_MAILER=${{ vars.MAIL_MAILER }}
                  MAIL_HOST=${{ vars.MAIL_HOST }}
                  MAIL_PORT=${{ vars.MAIL_PORT }}
                  MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
                  MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
                  MAIL_ENCRYPTION=${{ vars.MAIL_ENCRYPTION }}
                  MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS }}
                  MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}

                  # AWS Configuration
                  AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}
                  AWS_BUCKET=${{ vars.AWS_BUCKET }}
                  AWS_USE_PATH_STYLE_ENDPOINT=${{ vars.AWS_USE_PATH_STYLE_ENDPOINT }}

                  # OCI Object Storage Configuration
                  OCI_ACCESS_KEY_ID=${{ secrets.OCI_ACCESS_KEY_ID }}
                  OCI_SECRET_ACCESS_KEY=${{ secrets.OCI_SECRET_ACCESS_KEY }}
                  OCI_DEFAULT_REGION=${{ vars.OCI_DEFAULT_REGION }}
                  OCI_BUCKET=${{ vars.OCI_BUCKET }}
                  OCI_ENDPOINT=${{ vars.OCI_ENDPOINT }}

                  # OCI Public Object Storage Configuration
                  OCI_PUBLIC_ACCESS_KEY_ID=${{ secrets.OCI_PUBLIC_ACCESS_KEY_ID }}
                  OCI_PUBLIC_SECRET_ACCESS_KEY=${{ secrets.OCI_PUBLIC_SECRET_ACCESS_KEY }}
                  OCI_PUBLIC_DEFAULT_REGION=${{ vars.OCI_PUBLIC_DEFAULT_REGION }}
                  OCI_PUBLIC_BUCKET=${{ vars.OCI_PUBLIC_BUCKET }}
                  OCI_PUBLIC_ENDPOINT=${{ vars.OCI_PUBLIC_ENDPOINT }}

                  # SES Configuration
                  SES_ACCESS_KEY_ID=${{ secrets.SES_ACCESS_KEY_ID }}
                  SES_SECRET_ACCESS_KEY=${{ secrets.SES_SECRET_ACCESS_KEY }}
                  SES_DEFAULT_REGION=${{ vars.SES_DEFAULT_REGION }}

                  # Pusher Configuration
                  PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
                  PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
                  PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}
                  PUSHER_APP_CLUSTER=${{ vars.PUSHER_APP_CLUSTER }}

                  MIX_PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
                  MIX_PUSHER_APP_CLUSTER=${{ vars.PUSHER_APP_CLUSTER }}

                  # Twilio Configuration
                  OTPIFY_TWILIO_SID=${{ secrets.OTPIFY_TWILIO_SID }}
                  OTPIFY_TWILIO_TOKEN=${{ secrets.OTPIFY_TWILIO_TOKEN }}
                  OTPIFY_TWILIO_FROM=${{ vars.OTPIFY_TWILIO_FROM }}
                  OTPIFY_TWILIO_VERIFY_SID=${{ secrets.OTPIFY_TWILIO_VERIFY_SID }}
                  OTPIFY_TWILIO_SSL_VERIFY_PEER=${{ vars.OTPIFY_TWILIO_SSL_VERIFY_PEER }}
                  OTPIFY_TWILIO_SSL_VERIFY_HOST=${{ vars.OTPIFY_TWILIO_SSL_VERIFY_HOST }}

                  # Application Specific - OTP & Auth
                  OTPIFY_DEFAULT_DRIVER=${{ vars.OTPIFY_DEFAULT_DRIVER }}
                  OTPIFY_CODE_LENGTH=${{ vars.OTPIFY_CODE_LENGTH }}
                  OTPIFY_CODE_EXPIRATION_TIME=${{ vars.OTPIFY_CODE_EXPIRATION_TIME }}
                  OTPIFY_AUTH_DEFAULT_DRIVER=${{ vars.OTPIFY_AUTH_DEFAULT_DRIVER }}
                  OTPIFY_NATIONAL_ID_DEFAULT_DRIVER=${{ vars.OTPIFY_NATIONAL_ID_DEFAULT_DRIVER }}

                  # SMS & Mobile Verification
                  SMS_DEFAULT_DRIVER=${{ vars.SMS_DEFAULT_DRIVER }}
                  MOBILE_VERIFY_DEFAULT_DRIVER=${{ vars.MOBILE_VERIFY_DEFAULT_DRIVER }}

                  # Bitly
                  BITLY_ACCESS_TOKEN=${{ secrets.BITLY_ACCESS_TOKEN }}

                  AUTHORIZED_TOKEN_LENGTH=${{ vars.AUTHORIZED_TOKEN_LENGTH }}
                  DEFAULT_GUARD=${{ vars.DEFAULT_GUARD }}
                  PERMISSION_GUARDS=${{ vars.PERMISSION_GUARDS }}
                  GRANTIFY_DEFAULT_DRIVER=${{ vars.GRANTIFY_DEFAULT_DRIVER }}
                  SETTINGS_CACHE_ENABLED=${{ vars.SETTINGS_CACHE_ENABLED }}
                  HOST_WHITELIST=${{ vars.HOST_WHITELIST }}

                  # Sanctum
                  SANCTUM_STATEFUL_DOMAINS=${{ vars.SANCTUM_STATEFUL_DOMAINS }}

                  # Telescope
                  TELESCOPE_ENABLED=${{ vars.TELESCOPE_ENABLED }}
                  TELESCOPE_PRUNE_HOURS=${{ vars.TELESCOPE_PRUNE_HOURS }}
                  TELESCOPE_DB_CONNECTION=${{ vars.TELESCOPE_DB_CONNECTION }}
                  TELESCOPE_DB_HOST=${{ vars.TELESCOPE_DB_HOST }}
                  TELESCOPE_DB_PORT=${{ vars.TELESCOPE_DB_PORT }}
                  TELESCOPE_DB_DATABASE=${{ vars.TELESCOPE_DB_DATABASE }}
                  TELESCOPE_DB_USERNAME=${{ vars.TELESCOPE_DB_USERNAME }}
                  TELESCOPE_DB_PASSWORD=${{ secrets.TELESCOPE_DB_PASSWORD }}

                  # Trading & SMS
                  DEFAULT_TRADER=${{ vars.DEFAULT_TRADER }}
                  MSEGAT_USERNAME=${{ secrets.MSEGAT_USERNAME }}
                  MSEGAT_API_KEY=${{ secrets.MSEGAT_API_KEY }}

                  # Bursam Trader Configuration
                  BURSAM_FAKE=${{ vars.BURSAM_FAKE }}
                  BURSAM_BASE_URL=${{ vars.BURSAM_BASE_URL }}
                  BURSAM_SELLING_COMMODITY_START_TIME=${{ vars.BURSAM_SELLING_COMMODITY_START_TIME }}
                  BURSAM_SELLING_COMMODITY_END_TIME=${{ vars.BURSAM_SELLING_COMMODITY_END_TIME }}
                  BURSAM_MARKET_OPENING_START_TIME=${{ vars.BURSAM_MARKET_OPENING_START_TIME }}
                  BURSAM_MARKET_OPENING_END_TIME=${{ vars.BURSAM_MARKET_OPENING_END_TIME }}
                  BURSAM_RATE_LIMIT_MAX_RETRIES_BEFORE_EXCEPTION=${{ vars.BURSAM_RATE_LIMIT_MAX_RETRIES_BEFORE_EXCEPTION }}

                  # JWT Secret
                  JWT_SECRET=${{ secrets.JWT_SECRET }}

                  # EDAAT Configuration
                  EDAAT_BASE_URL=${{ vars.EDAAT_BASE_URL }}
                  EDAAT_WEBHOOK_URL=${{ vars.EDAAT_WEBHOOK_URL }}
                  EDAAT_PRODUCT=${{ vars.EDAAT_PRODUCT }}
                  EDAAT_USERNAME=${{ vars.EDAAT_USERNAME }}
                  EDAAT_PASSWORD=${{ secrets.EDAAT_PASSWORD }}
                  EDAAT_COMPANY=${{ vars.EDAAT_COMPANY }}
                  EDAAT_VERIFY_TLS_CERTS=${{ vars.EDAAT_VERIFY_TLS_CERTS }}
                  EDAAT_PAYMENT_URL=${{ vars.EDAAT_PAYMENT_URL }}
                  EDAAT_BILL_URL=${{ vars.EDAAT_BILL_URL }}
                  EDAAT_RECONCILE_URL=${{ vars.EDAAT_RECONCILE_URL }}

                  # Wallet Configuration
                  WALLET_CACHE_DRIVER=${{ vars.WALLET_CACHE_DRIVER }}
                  WALLET_CACHE_TTL=${{ vars.WALLET_CACHE_TTL }}
                  WALLET_LOCK_DRIVER=${{ vars.WALLET_LOCK_DRIVER }}
                  WALLET_LOCK_SECONDS=${{ vars.WALLET_LOCK_SECONDS }}

                  # RabbitMQ Configuration
                  RABBITMQ_QUEUE_NAME=${{ vars.RABBITMQ_QUEUE_NAME }}
                  RABBITMQ_HOST=${{ vars.RABBITMQ_HOST }}
                  RABBITMQ_PORT=${{ vars.RABBITMQ_PORT }}
                  RABBITMQ_USER=${{ vars.RABBITMQ_USER }}
                  RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
                  RABBITMQ_VHOST=${{ vars.RABBITMQ_VHOST }}

                  # reCAPTCHA Configuration
                  RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
                  RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
                  
                  # Lynk Application Configuration
                  LYNK_DEFAULT_VERSION=${{ vars.LYNK_DEFAULT_VERSION }}
                  LYNK_MAX_UNITS_PER_TRADER=${{ vars.LYNK_MAX_UNITS_PER_TRADER }}
                  GENERATE_UNITS_MAX_PATCH_SIZE_LIMIT=${{ vars.GENERATE_UNITS_MAX_PATCH_SIZE_LIMIT }}

                  # Rate Limiting
                  ENABLE_RATE_LIMITER=${{ vars.ENABLE_RATE_LIMITER }}

                  # Loan Coverage
                  LOAN_COVERAGE_STRATEGY=${{ vars.LOAN_COVERAGE_STRATEGY }}
                  LOAN_COVERAGE_TIMEOUT=${{ vars.LOAN_COVERAGE_TIMEOUT }}

                  # Auto-Verified Users (Development/Testing)
                  AUTO_VERIFIED_USERS=${{ vars.AUTO_VERIFIED_USERS }}
                  AUTO_VERIFIED_USERS_PASSWORD=${{ vars.AUTO_VERIFIED_USERS_PASSWORD }}

                  # Master OTP for Development
                  ALLOW_VERIFY_WITH_MASTER_KEY=${{ vars.ALLOW_VERIFY_WITH_MASTER_KEY }}
                  MASTER_OTP_KEY=${{ vars.MASTER_OTP_KEY }}

                  # Nightwatch Monitoring
                  NIGHTWATCH_ENABLED=${{ vars.NIGHTWATCH_ENABLED }}
                  NIGHTWATCH_TOKEN=${{ secrets.NIGHTWATCH_TOKEN }}
                  NIGHTWATCH_REQUEST_SAMPLE_RATE=${{ vars.NIGHTWATCH_REQUEST_SAMPLE_RATE }}
                  NIGHTWATCH_COMMAND_SAMPLE_RATE=${{ vars.NIGHTWATCH_COMMAND_SAMPLE_RATE }}
                  NIGHTWATCH_EXCEPTION_SAMPLE_RATE=${{ vars.NIGHTWATCH_EXCEPTION_SAMPLE_RATE }}


                  # Bursam Trader Configuration
                  BURSAM_FAKE=${{ vars.BURSAM_FAKE }}
                  BURSAM_BASE_URL=${{ vars.BURSAM_BASE_URL }}
                  BURSAM_SELLING_COMMODITY_START_TIME=${{ vars.BURSAM_SELLING_COMMODITY_START_TIME }}
                  BURSAM_SELLING_COMMODITY_END_TIME=${{ vars.BURSAM_SELLING_COMMODITY_END_TIME }}
                  BURSAM_MARKET_OPENING_START_TIME=${{ vars.BURSAM_MARKET_OPENING_START_TIME }}
                  BURSAM_MARKET_OPENING_END_TIME=${{ vars.BURSAM_MARKET_OPENING_END_TIME }}
                  BURSAM_RATE_LIMIT_MAX_RETRIES_BEFORE_EXCEPTION=${{ vars.BURSAM_RATE_LIMIT_MAX_RETRIES_BEFORE_EXCEPTION }}

                  # Sanctum
                  SANCTUM_STATEFUL_DOMAINS=${{ vars.SANCTUM_STATEFUL_DOMAINS }}

                  OTPIFY_AUTH_DEFAULT_DRIVER=${{ vars.OTPIFY_AUTH_DEFAULT_DRIVER }}
                  OTPIFY_NATIONAL_ID_DEFAULT_DRIVER=${{ vars.OTPIFY_NATIONAL_ID_DEFAULT_DRIVER }}

                  # SMS & Mobile Verification
                  SMS_DEFAULT_DRIVER=${{ vars.SMS_DEFAULT_DRIVER }}
                  MOBILE_VERIFY_DEFAULT_DRIVER=${{ vars.MOBILE_VERIFY_DEFAULT_DRIVER }}

                  # Bitly
                  BITLY_ACCESS_TOKEN=${{ secrets.BITLY_ACCESS_TOKEN }}

                  # Memcached Configuration
                  MEMCACHED_HOST=${{ vars.MEMCACHED_HOST }}

                  # OCI Object Storage Configuration
                  OCI_ACCESS_KEY_ID=${{ secrets.OCI_ACCESS_KEY_ID }}
                  OCI_SECRET_ACCESS_KEY=${{ secrets.OCI_SECRET_ACCESS_KEY }}
                  OCI_DEFAULT_REGION=${{ vars.OCI_DEFAULT_REGION }}
                  OCI_BUCKET=${{ vars.OCI_BUCKET }}
                  OCI_ENDPOINT=${{ vars.OCI_ENDPOINT }}

                  # OCI Public Object Storage Configuration
                  OCI_PUBLIC_ACCESS_KEY_ID=${{ secrets.OCI_PUBLIC_ACCESS_KEY_ID }}
                  OCI_PUBLIC_SECRET_ACCESS_KEY=${{ secrets.OCI_PUBLIC_SECRET_ACCESS_KEY }}
                  OCI_PUBLIC_DEFAULT_REGION=${{ vars.OCI_PUBLIC_DEFAULT_REGION }}
                  OCI_PUBLIC_BUCKET=${{ vars.OCI_PUBLIC_BUCKET }}
                  OCI_PUBLIC_ENDPOINT=${{ vars.OCI_PUBLIC_ENDPOINT }}

                  # PDF & Storage
                  DEFAULT_PDF_GENERATOR=${{ vars.DEFAULT_PDF_GENERATOR }}
                  STATIC_PDF_STORAGE_DRIVER=${{ vars.STATIC_PDF_STORAGE_DRIVER }}

                  # Lynk Application Configuration
                  LYNK_DEFAULT_VERSION=${{ vars.LYNK_DEFAULT_VERSION }}
                  LYNK_MAX_UNITS_PER_TRADER=${{ vars.LYNK_MAX_UNITS_PER_TRADER }}
                  GENERATE_UNITS_MAX_PATCH_SIZE_LIMIT=${{ vars.GENERATE_UNITS_MAX_PATCH_SIZE_LIMIT }}

                  # Rate Limiting
                  ENABLE_RATE_LIMITER=${{ vars.ENABLE_RATE_LIMITER }}

                  # Loan Coverage
                  LOAN_COVERAGE_STRATEGY=${{ vars.LOAN_COVERAGE_STRATEGY }}
                  LOAN_COVERAGE_TIMEOUT=${{ vars.LOAN_COVERAGE_TIMEOUT }}

                  # Auto-Verified Users (Development/Testing)
                  AUTO_VERIFIED_USERS=${{ vars.AUTO_VERIFIED_USERS }}
                  AUTO_VERIFIED_USERS_PASSWORD=${{ secrets.AUTO_VERIFIED_USERS_PASSWORD }}

                  # Nightwatch Monitoring
                  NIGHTWATCH_ENABLED=${{ vars.NIGHTWATCH_ENABLED }}
                  NIGHTWATCH_TOKEN=${{ secrets.NIGHTWATCH_TOKEN }}
                  NIGHTWATCH_REQUEST_SAMPLE_RATE=${{ vars.NIGHTWATCH_REQUEST_SAMPLE_RATE }}
                  NIGHTWATCH_COMMAND_SAMPLE_RATE=${{ vars.NIGHTWATCH_COMMAND_SAMPLE_RATE }}
                  NIGHTWATCH_EXCEPTION_SAMPLE_RATE=${{ vars.NIGHTWATCH_EXCEPTION_SAMPLE_RATE }}
                  ENVEOF

                  echo "✓ .env file created from GitHub secrets/variables"
                  echo "File size: $(wc -c < .env.build) bytes"

                  # Rename to .env so Docker can copy it
                  mv .env.build .env

                  echo "✓ Renamed to .env for Docker build"
                  echo "First 5 lines of .env:"
                  head -5 .env

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/laravel/Dockerfile
                  load: true
                  tags: |
                      app-php-fpm:${{ needs.setup.outputs.commit_hash }}
                      app-php-fpm:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Run security scan on image
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: app-php-fpm:${{ needs.setup.outputs.commit_hash }}
                  format: 'sarif'
                  output: 'trivy-results.sarif'
                  severity: 'CRITICAL,HIGH'

            - name: Save and compress Docker image
              run: |
                  echo "📦 Saving Docker image to tar archive..."
                  docker save app-php-fpm:${{ needs.setup.outputs.commit_hash }} | gzip > /tmp/app-php-fpm.tar.gz

                  echo "Compressed image size:"
                  ls -lh /tmp/app-php-fpm.tar.gz

                  echo "✅ Image saved successfully"

            - name: Upload Docker image as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docker-image-dev
                  path: /tmp/app-php-fpm.tar.gz
                  retention-days: 1

            - name: Clean up
              if: always()
              run: |
                  rm -f .env.build

    deploy:
        needs: [build, setup]
        runs-on: ubuntu-latest
        environment: development
        strategy:
            matrix:
                # Get servers from the setup job output
                # DEPLOYMENT_SERVER_IPS must be a JSON array: ["10.0.0.1", "10.0.0.2"]
                server: ${{ fromJson(needs.setup.outputs.servers) }}
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download Docker image
              uses: actions/download-artifact@v4
              with:
                  name: docker-image-dev
                  path: /tmp/

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOYMENT_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key

            - name: Transfer image to server ${{ matrix.server }}
              run: |
                  echo "🚀 Transferring Docker image to ${{ matrix.server }}..."

                  scp -i ~/.ssh/deploy_key \
                      -o StrictHostKeyChecking=no \
                      -o ConnectTimeout=30 \
                      -o Compression=yes \
                      -C /tmp/app-php-fpm.tar.gz \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }}:/tmp/

                  echo "✅ Image transferred to ${{ matrix.server }}"

            - name: Transfer docker-compose.yml and deployment script to server
              run: |
                  echo "📋 Transferring docker-compose.yml and deployment script to server..."

                  # Transfer docker-compose.yml
                  scp -i ~/.ssh/deploy_key \
                      -o StrictHostKeyChecking=no \
                      docker-compose.yml \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }}:/var/www/lynk-backend/

                  # Transfer deployment script
                  scp -i ~/.ssh/deploy_key \
                      -o StrictHostKeyChecking=no \
                      .github/scripts/deploy-with-rollback.sh \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }}:/tmp/deploy-with-rollback.sh

                  # Make script executable
                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} \
                      "chmod +x /tmp/deploy-with-rollback.sh"

                  echo "✅ Files transferred and script made executable"

            - name: Deploy containers on server ${{ matrix.server }} with zero-downtime
              run: |
                  echo "🚀 Deploying containers on ${{ matrix.server }} with zero-downtime strategy..."

                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} "
                    set -euo pipefail

                    # Load new Docker image
                    echo '📥 Loading new Docker image...'
                    gunzip -c /tmp/app-php-fpm.tar.gz | docker load
                    rm -f /tmp/app-php-fpm.tar.gz

                    # Tag as latest
                    echo '🏷️  Tagging image as latest...'
                    docker tag app-php-fpm:${{ needs.setup.outputs.commit_hash }} app-php-fpm:latest

                    # Execute zero-downtime deployment script
                    echo '🚀 Executing zero-downtime deployment with automatic rollback...'
                    /tmp/deploy-with-rollback.sh

                    # Cleanup deployment script
                    rm -f /tmp/deploy-with-rollback.sh
                  "

            - name: Verify deployment status
              run: |
                  echo "📊 Verifying final deployment status on ${{ matrix.server }}..."

                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} "
                    cd /var/www/lynk-backend

                    echo '📊 Container Status:'
                    docker compose ps --format 'table {{.Name}}\t{{.Status}}'

                    echo ''
                    echo '📈 Container Counts:'
                    RUNNING=\$(docker compose ps | grep -c 'Up' || echo '0')
                    TOTAL=\$(docker compose ps -a | wc -l)
                    echo \"Running: \$RUNNING / \$TOTAL containers\"

                    echo ''
                    echo '✅ Deployment verification complete'
                  "

            - name: Run post-deployment tasks
              run: |
                  echo "🔧 Running post-deployment tasks on ${{ matrix.server }}..."

                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} "
                    echo '🗄️  Running database migrations...'
                    docker exec lynk-laravel-app php artisan migrate --force

                    echo '🧹 Clearing application cache...'
                    docker exec lynk-laravel-app php artisan structure:clear
                    docker exec lynk-laravel-app php artisan package:discover

                    echo '✅ Post-deployment tasks completed'
                  "

            - name: Verify deployment
              run: |
                  echo "🔍 Verifying deployment on ${{ matrix.server }}..."

                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                      ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} "
                    cd /var/www/lynk-backend

                    echo '📊 Container Summary:'
                    echo '==================='
                    docker compose ps --format 'table {{.Name}}\\t{{.Status}}'

                    echo ''
                    echo '📈 Container Count:'
                    echo 'Total containers: '\$(docker compose ps -q | wc -l)

                    echo ''
                    echo '🏷️  Image Information:'
                    docker images | grep app-php-fpm

                    echo ''
                    echo '✅ Deployment verification complete on ${{ matrix.server }}'
                  "

    test:
        name: 🧪 Regression Tests
        runs-on: ubuntu-latest
        needs: deploy
        if: ${{ needs.deploy.result == 'success' }}
        steps:
          - name: Install SSH key
            uses: webfactory/ssh-agent@v0.5.3
            with:
              ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

          - name: 🔍 Debug SSH User
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                echo 'Current user:' && whoami &&
                echo 'Home directory:' && echo \$HOME &&
                echo 'Looking for automation repo...' &&
                sudo find /home -name 'lynk-backend-automation' -type d 2>/dev/null &&
                echo 'Permissions on /home:' && ls -la /home/
              "

          - name: 🔄 Update Automation Repo
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  git remote set-url origin https://x-access-token:${{ secrets.GB_OAUTH_TOKEN }}@github.com/lynksa/lynk-backend-automation.git &&
                  git fetch origin main &&
                  git reset --hard origin/main &&
                  echo \"Updated to commit: \$(git rev-parse HEAD)\"
                '
              "

          - name: 🧹 Prepare Test Environment
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  rm -rf allure-results merged-allure-results allure-report &&
                  mkdir -p allure-results/admin allure-results/lender allure-results/supplier merged-allure-results
                '
              "

          - name: 🧪 Run Regression Tests
            id: run-tests
            run: |
              # Use SSH with keepalive to prevent connection timeout during long test runs
              ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&

                  # Thorough cleanup of any existing containers and networks
                  echo \"🧹 Cleaning up existing Docker resources...\"
                  docker-compose down --remove-orphans -v 2>/dev/null || true
                  docker rm -f test-admin test-lender test-supplier 2>/dev/null || true
                  docker network rm lynk-backend-automation_default 2>/dev/null || true

                  # Small delay to ensure cleanup is complete
                  sleep 2

                  echo \"🔨 Building containers...\"
                  docker-compose build --no-cache

                  echo \"🚀 Starting containers...\"
                  if ! docker-compose up -d; then
                    echo \"❌ Failed to start containers\"
                    docker-compose logs
                    exit 2
                  fi

                  # Verify containers are running
                  echo \"📋 Checking container status...\"
                  docker ps -a

                  echo \"⏳ Waiting for all test containers to complete (this may take 15-25 minutes)...\"

                  # Wait for containers with progress updates to keep connection alive
                  # Check every 30 seconds and print status
                  while true; do
                    ADMIN_RUNNING=\$(docker ps -q -f name=test-admin 2>/dev/null)
                    LENDER_RUNNING=\$(docker ps -q -f name=test-lender 2>/dev/null)
                    SUPPLIER_RUNNING=\$(docker ps -q -f name=test-supplier 2>/dev/null)

                    if [ -z \"\$ADMIN_RUNNING\" ] && [ -z \"\$LENDER_RUNNING\" ] && [ -z \"\$SUPPLIER_RUNNING\" ]; then
                      echo \"All containers have stopped.\"
                      break
                    fi

                    # Print which containers are still running
                    RUNNING=\"\"
                    [ -n \"\$ADMIN_RUNNING\" ] && RUNNING=\"\$RUNNING admin\"
                    [ -n \"\$LENDER_RUNNING\" ] && RUNNING=\"\$RUNNING lender\"
                    [ -n \"\$SUPPLIER_RUNNING\" ] && RUNNING=\"\$RUNNING supplier\"
                    echo \"[$(date +%H:%M:%S)] Still running:\$RUNNING\"

                    sleep 30
                  done

                  # Get exit codes from stopped containers
                  ADMIN_EXIT=\$(docker inspect test-admin --format=\"{{.State.ExitCode}}\" 2>/dev/null) || ADMIN_EXIT=999
                  LENDER_EXIT=\$(docker inspect test-lender --format=\"{{.State.ExitCode}}\" 2>/dev/null) || LENDER_EXIT=999
                  SUPPLIER_EXIT=\$(docker inspect test-supplier --format=\"{{.State.ExitCode}}\" 2>/dev/null) || SUPPLIER_EXIT=999

                  echo \"Container exit codes:\"
                  echo \"  test-admin: \$ADMIN_EXIT\"
                  echo \"  test-lender: \$LENDER_EXIT\"
                  echo \"  test-supplier: \$SUPPLIER_EXIT\"

                  # Show logs for debugging
                  echo \"📋 Container logs:\"
                  docker-compose logs --tail=100

                  # Check if any container failed catastrophically
                  # Exit code 0 = all tests passed
                  # Exit code 1 = Maven test failures (acceptable - tests ran)
                  # Exit code > 1 = infrastructure issues
                  # Exit code 999 = container did not exist/start
                  FAILED=0

                  if [ \"\$ADMIN_EXIT\" -eq 999 ]; then
                    echo \"❌ test-admin container did not start\"
                    FAILED=1
                  elif [ \"\$ADMIN_EXIT\" -gt 1 ]; then
                    echo \"❌ test-admin crashed with exit code \$ADMIN_EXIT\"
                    FAILED=1
                  fi

                  if [ \"\$LENDER_EXIT\" -eq 999 ]; then
                    echo \"❌ test-lender container did not start\"
                    FAILED=1
                  elif [ \"\$LENDER_EXIT\" -gt 1 ]; then
                    echo \"❌ test-lender crashed with exit code \$LENDER_EXIT\"
                    FAILED=1
                  fi

                  if [ \"\$SUPPLIER_EXIT\" -eq 999 ]; then
                    echo \"❌ test-supplier container did not start\"
                    FAILED=1
                  elif [ \"\$SUPPLIER_EXIT\" -gt 1 ]; then
                    echo \"❌ test-supplier crashed with exit code \$SUPPLIER_EXIT\"
                    FAILED=1
                  fi

                  # Verify result files exist
                  ADMIN_COUNT=\$(find allure-results/admin -name \"*-result.json\" 2>/dev/null | wc -l)
                  LENDER_COUNT=\$(find allure-results/lender -name \"*-result.json\" 2>/dev/null | wc -l)
                  SUPPLIER_COUNT=\$(find allure-results/supplier -name \"*-result.json\" 2>/dev/null | wc -l)

                  echo \"Result file counts:\"
                  echo \"  admin: \$ADMIN_COUNT\"
                  echo \"  lender: \$LENDER_COUNT\"
                  echo \"  supplier: \$SUPPLIER_COUNT\"

                  if [ \"\$ADMIN_COUNT\" -eq 0 ] || [ \"\$LENDER_COUNT\" -eq 0 ] || [ \"\$SUPPLIER_COUNT\" -eq 0 ]; then
                    echo \"❌ Missing test results from one or more containers\"
                    FAILED=1
                  fi

                  docker-compose down --remove-orphans 2>/dev/null || true

                  if [ \"\$FAILED\" -eq 1 ]; then
                    echo \"❌ Test execution had infrastructure issues\"
                    exit 2
                  fi

                  echo \"✅ All containers completed with test results\"
                '
              "
            continue-on-error: true
            timeout-minutes: 45

          - name: 🔧 Fix Permissions
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo chown -R ubuntu:ubuntu /home/ubuntu/lynk-backend-automation/allure-results /home/ubuntu/lynk-backend-automation/allure-report /home/ubuntu/lynk-backend-automation/merged-allure-results 2>/dev/null || true
              "

          - name: 📊 Merge Allure Results
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  mkdir -p merged-allure-results &&
                  cp -R allure-results/admin/* merged-allure-results/ 2>/dev/null || true &&
                  cp -R allure-results/lender/* merged-allure-results/ 2>/dev/null || true &&
                  cp -R allure-results/supplier/* merged-allure-results/ 2>/dev/null || true
                '
              "

          - name: 📈 Generate Allure Report
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  allure generate merged-allure-results -o allure-report --clean
                '
              "

          - name: 📥 Download Allure Report
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  tar -czf /tmp/allure-report.tar.gz allure-report merged-allure-results
                '
                sudo chmod 644 /tmp/allure-report.tar.gz
              "
              scp -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }}:/tmp/allure-report.tar.gz ./allure-report.tar.gz
              tar -xzf allure-report.tar.gz

          - name: 📊 Extract Test Results
            id: test-results
            run: |
              # Install jq for JSON processing
              sudo apt-get update && sudo apt-get install -y jq

              TOTAL=0
              PASSED=0
              FAILED=0
              SKIPPED=0

              if [ -d "merged-allure-results" ]; then
                for f in merged-allure-results/*-result.json; do
                  if [ -f "$f" ]; then
                    status=$(jq -r '.status // "unknown"' "$f" 2>/dev/null)
                    case "$status" in
                      "passed") PASSED=$((PASSED + 1)) ;;
                      "failed"|"broken") FAILED=$((FAILED + 1)) ;;
                      "skipped") SKIPPED=$((SKIPPED + 1)) ;;
                    esac
                  fi
                done
                TOTAL=$((PASSED + FAILED + SKIPPED))
              fi

              echo "total=$TOTAL" >> $GITHUB_OUTPUT
              echo "passed=$PASSED" >> $GITHUB_OUTPUT
              echo "failed=$FAILED" >> $GITHUB_OUTPUT
              echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

              if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
                echo "status=✅ PASSED" >> $GITHUB_OUTPUT
                echo "color=good" >> $GITHUB_OUTPUT
                echo "emoji=✅" >> $GITHUB_OUTPUT
              else
                echo "status=❌ FAILED" >> $GITHUB_OUTPUT
                echo "color=danger" >> $GITHUB_OUTPUT
                echo "emoji=❌" >> $GITHUB_OUTPUT
              fi

              echo "Test counts: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"

          - name: 📤 Upload Allure Results Artifact
            uses: actions/upload-artifact@v4
            with:
              name: deploy-validation-allure-results
              path: merged-allure-results/
              retention-days: 30

          - name: 📤 Upload Allure Report Artifact
            uses: actions/upload-artifact@v4
            with:
              name: deploy-validation-allure-report
              path: allure-report/
              retention-days: 30

          - name: Set link vars
            id: links
            run: |
              # GitHub Pages URLs
              BASE_URL="https://${{ github.repository_owner }}.github.io/lynk-backend"
              echo "THIS_RUN_URL=${BASE_URL}/deploy-validation/${{ github.run_number }}/" >> $GITHUB_OUTPUT
              echo "LATEST_URL=${BASE_URL}/deploy-validation/latest/" >> $GITHUB_OUTPUT
              echo "DASHBOARD_URL=${BASE_URL}/deploy-validation/" >> $GITHUB_OUTPUT

              echo "📊 Generated URLs:"
              echo "  - This Run: ${BASE_URL}/deploy-validation/${{ github.run_number }}/"
              echo "  - Latest: ${BASE_URL}/deploy-validation/latest/"
              echo "  - Dashboard: ${BASE_URL}/deploy-validation/"

          - name: 📦 Prepare GitHub Pages Content
            run: |
              # Create unified deployment directory structure
              mkdir -p gh-pages-deploy/deploy-validation/${{ github.run_number }}
              mkdir -p gh-pages-deploy/deploy-validation/latest
              mkdir -p gh-pages-deploy/deploy-validation/data

              # Copy allure report to run number directory
              cp -R allure-report/* gh-pages-deploy/deploy-validation/${{ github.run_number }}/

              # Copy allure report to latest directory
              cp -R allure-report/* gh-pages-deploy/deploy-validation/latest/

              # Checkout gh-pages to get existing dashboard data
              git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GB_OAUTH_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-checkout || mkdir -p gh-pages-checkout

              # Initialize or update runs.json
              if [[ -f gh-pages-checkout/deploy-validation/data/runs.json ]]; then
                cp gh-pages-checkout/deploy-validation/data/runs.json gh-pages-deploy/deploy-validation/data/runs.json
              else
                echo "[]" > gh-pages-deploy/deploy-validation/data/runs.json
              fi

              # Add current run to metadata
              jq --arg run "${{ github.run_number }}" \
                --arg branch "${{ github.ref_name }}" \
                --arg status "${{ steps.test-results.outputs.status }}" \
                --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg total "${{ steps.test-results.outputs.total }}" \
                --arg passed "${{ steps.test-results.outputs.passed }}" \
                --arg failed "${{ steps.test-results.outputs.failed }}" \
                '. + [{"run": $run, "branch": $branch, "status": $status, "timestamp": $timestamp, "total": $total|tonumber, "passed": $passed|tonumber, "failed": $failed|tonumber}] | unique_by(.run) | sort_by(.run | tonumber) | reverse | .[0:50]' \
                gh-pages-deploy/deploy-validation/data/runs.json > gh-pages-deploy/deploy-validation/data/runs_new.json
              mv gh-pages-deploy/deploy-validation/data/runs_new.json gh-pages-deploy/deploy-validation/data/runs.json

              # Create deploy-validation-specific dashboard HTML
              cat > gh-pages-deploy/deploy-validation/index.html << 'HTMLEOF'
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Deploy Validation - Lynk Test Reports</title>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <style>
                      * { margin: 0; padding: 0; box-sizing: border-box; }
                      body {
                          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                          background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
                          min-height: 100vh;
                          padding: 20px;
                      }
                      .container {
                          max-width: 1200px;
                          margin: 0 auto;
                      }
                      .header {
                          background: white;
                          border-radius: 10px;
                          padding: 30px;
                          margin-bottom: 30px;
                          box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                      }
                      h1 {
                          color: #2d3748;
                          margin-bottom: 10px;
                      }
                      .quick-links {
                          display: grid;
                          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                          gap: 20px;
                          margin-bottom: 30px;
                      }
                      .quick-link {
                          background: white;
                          padding: 20px;
                          border-radius: 10px;
                          box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                          text-decoration: none;
                          color: #2d3748;
                          transition: transform 0.2s;
                      }
                      .quick-link:hover {
                          transform: translateY(-5px);
                          box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                      }
                      .runs-container {
                          background: white;
                          border-radius: 10px;
                          padding: 30px;
                          box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                      }
                      table {
                          width: 100%;
                          border-collapse: collapse;
                          margin-top: 20px;
                      }
                      th {
                          background: #f7fafc;
                          padding: 12px;
                          text-align: left;
                          border-bottom: 2px solid #e2e8f0;
                      }
                      td {
                          padding: 12px;
                          border-bottom: 1px solid #e2e8f0;
                      }
                      .status-success, .status-✅ { color: #22543d; background: #c6f6d5; padding: 4px 8px; border-radius: 4px; }
                      .status-failure, .status-❌ { color: #742a2a; background: #fed7d7; padding: 4px 8px; border-radius: 4px; }
                      .view-btn {
                          background: #1a202c;
                          color: white;
                          padding: 8px 16px;
                          border-radius: 6px;
                          text-decoration: none;
                          display: inline-block;
                      }
                      .view-btn:hover {
                          background: #2d3748;
                      }
                  </style>
              </head>
              <body>
                  <div class="container">
                      <div class="header">
                          <h1>Deploy Validation Reports</h1>
                          <p>Post-Deploy Regression Testing - Test Execution Dashboard</p>
                      </div>

                      <div class="quick-links">
                          <a href="latest/" class="quick-link">
                              <h3>Latest Report</h3>
                              <p>View the most recent test execution</p>
                          </a>
                          <a href="../" class="quick-link">
                              <h3>All Workflows</h3>
                              <p>Back to main dashboard</p>
                          </a>
                      </div>

                      <div class="runs-container">
                          <h2>Deploy Validation Run History</h2>
                          <table>
                              <thead>
                                  <tr>
                                      <th>Run #</th>
                                      <th>Status</th>
                                      <th>Branch</th>
                                      <th>Tests</th>
                                      <th>Date</th>
                                      <th>Action</th>
                                  </tr>
                              </thead>
                              <tbody id="runs-table">
                                  <!-- Will be populated by JavaScript -->
                              </tbody>
                          </table>
                      </div>
                  </div>

                  <script>
                      // Load and display runs
                      fetch('data/runs.json')
                          .then(response => response.json())
                          .then(runs => {
                              const tbody = document.getElementById('runs-table');
                              runs.forEach(run => {
                                  const row = document.createElement('tr');
                                  const testSummary = `${run.passed} passed / ${run.failed} failed / ${run.total} total`;
                                  const statusClass = run.status.includes('PASSED') ? 'status-success' : 'status-failure';
                                  row.innerHTML = `
                                      <td><strong>#${run.run}</strong></td>
                                      <td><span class="${statusClass}">${run.status}</span></td>
                                      <td>${run.branch}</td>
                                      <td>${testSummary}</td>
                                      <td>${new Date(run.timestamp).toLocaleString()}</td>
                                      <td><a href="${run.run}/" class="view-btn">View Report</a></td>
                                  `;
                                  tbody.appendChild(row);
                              });
                          })
                          .catch(error => {
                              console.error('Error loading runs:', error);
                              document.getElementById('runs-table').innerHTML =
                                  '<tr><td colspan="6">No historical data available yet</td></tr>';
                          });
                  </script>
              </body>
              </html>
              HTMLEOF

              echo "GitHub Pages content prepared"
              ls -laR gh-pages-deploy/deploy-validation/ | head -50

          - name: 🌐 Deploy to GitHub Pages
            uses: peaceiris/actions-gh-pages@v3
            with:
              github_token: ${{ secrets.GB_OAUTH_TOKEN }}
              publish_dir: ./gh-pages-deploy
              publish_branch: gh-pages
              destination_dir: .
              keep_files: true

          - name: 🧹 Cleanup Remote
            if: always()
            run: |
              ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
                sudo -u ubuntu bash -c '
                  cd /home/ubuntu/lynk-backend-automation &&
                  docker-compose down --remove-orphans 2>/dev/null || true
                '
                sudo rm -f /tmp/allure-report.tar.gz
              "

          - name: 📢 Send Slack Notification
            if: always()
            uses: 8398a7/action-slack@v3
            with:
              status: custom
              custom_payload: |
                {
                  "text": "${{ steps.test-results.outputs.emoji }} Deploy Validation - Run #${{ github.run_number }}",
                  "attachments": [
                    {
                      "color": "${{ steps.test-results.outputs.color }}",
                      "title": "🚀 Deploy Validation Test Results",
                      "title_link": "${{ steps.links.outputs.THIS_RUN_URL }}",
                      "fields": [
                        {
                          "title": "Status",
                          "value": "${{ steps.test-results.outputs.status }}",
                          "short": true
                        },
                        {
                          "title": "Test Summary",
                          "value": "Total: ${{ steps.test-results.outputs.total }}\n✅ Passed: ${{ steps.test-results.outputs.passed }}\n❌ Failed: ${{ steps.test-results.outputs.failed }}\n⏭️ Skipped: ${{ steps.test-results.outputs.skipped }}",
                          "short": true
                        },
                        {
                          "title": "Branch",
                          "value": "${{ github.ref_name }}",
                          "short": true
                        },
                        {
                          "title": "Triggered By",
                          "value": "${{ github.actor }}",
                          "short": true
                        }
                      ],
                      "actions": [
                        {
                          "type": "button",
                          "text": "📊 This Run (#${{ github.run_number }})",
                          "url": "${{ steps.links.outputs.THIS_RUN_URL }}",
                          "style": "primary"
                        },
                        {
                          "type": "button",
                          "text": "📈 Latest Report",
                          "url": "${{ steps.links.outputs.LATEST_URL }}"
                        },
                        {
                          "type": "button",
                          "text": "🔧 Workflow Details",
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ],
                      "footer": "Lynk Backend • Deploy Validation"
                    }
                  ]
                }
            env:
              SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          - name: 📝 Create GitHub Summary
            if: always()
            run: |
              echo "## 🚀 Deploy Validation Test Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** ${{ steps.test-results.outputs.status }}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Total | ${{ steps.test-results.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
              echo "| ✅ Passed | ${{ steps.test-results.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
              echo "| ❌ Failed | ${{ steps.test-results.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
              echo "| ⏭️ Skipped | ${{ steps.test-results.outputs.skipped }} |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 📊 Reports" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **This Run (#${{ github.run_number }}):** [View Report](${{ steps.links.outputs.THIS_RUN_URL }})" >> $GITHUB_STEP_SUMMARY
              echo "- **Latest Results:** [View Latest](${{ steps.links.outputs.LATEST_URL }})" >> $GITHUB_STEP_SUMMARY
              echo "- **All Runs:** [View Dashboard](${{ steps.links.outputs.DASHBOARD_URL }})" >> $GITHUB_STEP_SUMMARY
              echo "- **Workflow:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    notify:
        needs: [deploy, setup]
        if: always()
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Send Slack notification
              run: |
                  STATUS="${{ needs.deploy.result }}"
                  if [ "$STATUS" = "success" ]; then
                    EMOJI="✅"
                    COLOR="good"
                    STATUS_LABEL="Success"
                  else
                    EMOJI="❌"
                    COLOR="danger"
                    STATUS_LABEL="Failed"
                  fi
                  START_TS="${{ needs.setup.outputs.start_ts }}"
                  END_TS=$(date +%s)
                  DURATION_SEC=$((END_TS - START_TS))
                  if [ "$DURATION_SEC" -lt 0 ]; then DURATION_SEC=0; fi
                  D_H=$((DURATION_SEC/3600))
                  D_M=$(((DURATION_SEC%3600)/60))
                  D_S=$((DURATION_SEC%60))
                  DURATION_HUMAN=$(printf "%02dh %02dm %02ds" "$D_H" "$D_M" "$D_S")
                  PR_URL="${{ github.event.pull_request.html_url }}"
                  PR_TITLE="${{ github.event.pull_request.title }}"
                  COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
                  if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
                    PR_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  fi
                  if [ -z "$PR_TITLE" ] || [ "$PR_TITLE" = "null" ]; then
                    if [ -n "$COMMIT_MESSAGE" ] && [ "$COMMIT_MESSAGE" != "null" ]; then
                      # Use only the first line of the commit message to avoid newlines breaking sed
                      PR_TITLE="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
                    else
                      PR_TITLE="$GITHUB_REPOSITORY"
                    fi
                  fi
                  # Make a sed-safe version of the title (remove '|' which is used as sed delimiter)
                  SAFE_PR_TITLE="$(printf '%s' "$PR_TITLE" | tr '|' '-')"
                  RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##refs/heads/}}"
                  IMAGE_TAG="app-php-fpm:${{ needs.setup.outputs.commit_hash }}"
                  # Use workflow start time (captured in setup) for display
                  START_TS="${{ needs.setup.outputs.start_ts }}"
                  TIMESTAMP="$(TZ=Africa/Cairo date -d @"$START_TS" +"%Y-%m-%d %H:%M:%S %Z")"
                  cat > /tmp/slack-payload.json <<'EOF'
                  {
                    "text": "Backend Deployment (Dev) - REPLACE_STATUS",
                    "attachments": [
                      {
                        "color": "REPLACE_COLOR",
                        "title": "REPLACE_TITLE",
                        "title_link": "REPLACE_RUN_URL",
                        "fields": [
                          { "title": "Branch", "value": "REPLACE_BRANCH", "short": true },
                          { "title": "Status", "value": "REPLACE_EMOJI REPLACE_STATUS", "short": true },
                          { "title": "Duration", "value": "REPLACE_DURATION", "short": true },
                          { "title": "PR / Commit", "value": "<REPLACE_PR|View>", "short": true },
                          { "title": "Run", "value": "<REPLACE_RUN_URL|View Workflow>", "short": true },
                          { "title": "Time", "value": "REPLACE_TIME", "short": true }
                        ],
                        "footer": "Lynk Backend (Dev)"
                      }
                    ]
                  }
                  EOF
                  sed -i \
                    -e "s|REPLACE_STATUS|$STATUS_LABEL|g" \
                    -e "s|REPLACE_COLOR|$COLOR|g" \
                    -e "s|REPLACE_RUN_URL|$RUN_URL|g" \
                    -e "s|REPLACE_RUN|${{ github.run_number }}|g" \
                    -e "s|REPLACE_TITLE|$SAFE_PR_TITLE|g" \
                    -e "s|REPLACE_BRANCH|$BRANCH|g" \
                    -e "s|REPLACE_EMOJI|$EMOJI|g" \
                    -e "s|REPLACE_DURATION|$DURATION_HUMAN|g" \
                    -e "s|REPLACE_PR|$PR_URL|g" \
                    -e "s|REPLACE_TIME|$TIMESTAMP|g" \
                    /tmp/slack-payload.json
                  echo "Slack payload:"
                  cat /tmp/slack-payload.json
                  curl -X POST -H 'Content-type: application/json' --data @/tmp/slack-payload.json ${{ secrets.SLACK_HOOK_URL }}
