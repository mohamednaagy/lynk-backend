name: deploy on dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        id: install-ssh-key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: pulling and build code
        id: pull-and-build
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} \
           "cd /var/www/lynk-backend/ && \
            git pull origin dev && \
            composer install --ignore-platform-reqs && \
            sudo php artisan migrate && \
            sudo php artisan structure:clear && \
            sudo php artisan structure:discover
            sudo supervisorctl stop all && \
            sudo supervisorctl start all"

      - name: set pr url
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        id: pr-url
        uses: kceb/pull-request-url-action@v1
        with:
          github-oauth-token: ${{ secrets.GB_OAUTH_TOKEN }}

      - name: print info
        if: always()
        run: |
          echo "Repository Name: $GITHUB_REPOSITORY"
          echo "Branch Name: $GITHUB_REF"
          echo "pr-url: ${{ steps.pr-url.outputs.url }}"
          echo "Execution Time: $(date)"
          echo "Workflow Status: ${{ job.status }}"

          curl --insecure -X POST -H 'Content-type: application/json' --data '{"text":"Repository Name: '"$GITHUB_REPOSITORY"'\nBranch Name: '"$GITHUB_REF"'\nExecution Time: '"$(date)"'\nWorkflow Status: '"${{ job.status }}"'\n pull request URL: '"${{ steps.pr-url.outputs.url }}"'"}'  ${{ secrets.SLACK_HOOK_URL }}

  test:
    name: 🧪 Regression Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🔍 Debug SSH User
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            echo 'Current user:' && whoami &&
            echo 'Home directory:' && echo \$HOME &&
            echo 'Looking for automation repo...' &&
            sudo find /home -name 'lynk-backend-automation' -type d 2>/dev/null &&
            echo 'Permissions on /home:' && ls -la /home/
          "

      - name: 🧹 Prepare Test Environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            sudo chown -R \$USER:\$USER . &&
            rm -rf allure-results merged-allure-results allure-report &&
            mkdir -p allure-results/admin allure-results/lender allure-results/supplier merged-allure-results &&
            git pull origin main
          "

      - name: 🧪 Run Regression Tests
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            docker-compose down --remove-orphans 2>/dev/null || true &&
            docker-compose build --no-cache &&
            docker-compose up --abort-on-container-exit || true &&
            docker-compose down
          "
        continue-on-error: true

      - name: 🔧 Fix Permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            sudo chown -R \$USER:\$USER allure-results allure-report merged-allure-results 2>/dev/null || true
          "

      - name: 📊 Merge Allure Results
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            mkdir -p merged-allure-results &&
            cp -R allure-results/admin/* merged-allure-results/ 2>/dev/null || true &&
            cp -R allure-results/lender/* merged-allure-results/ 2>/dev/null || true &&
            cp -R allure-results/supplier/* merged-allure-results/ 2>/dev/null || true
          "

      - name: 📈 Generate Allure Report
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            allure generate merged-allure-results -o allure-report --clean
          "

      - name: 📥 Download Allure Report
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            tar -czf /tmp/allure-report.tar.gz allure-report merged-allure-results
          "
          scp -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }}:/tmp/allure-report.tar.gz ./allure-report.tar.gz
          tar -xzf allure-report.tar.gz

      - name: 📊 Extract Test Results
        id: test-results
        run: |
          TOTAL=0
          PASSED=0
          FAILED=0

          if [ -d "merged-allure-results" ]; then
            for f in merged-allure-results/*-result.json; do
              if [ -f "$f" ]; then
                status=$(grep -o '"status":"[^"]*"' "$f" | head -1 | cut -d'"' -f4)
                case "$status" in
                  "passed") PASSED=$((PASSED + 1)) ;;
                  "failed"|"broken") FAILED=$((FAILED + 1)) ;;
                esac
              fi
            done
            TOTAL=$((PASSED + FAILED))
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-allure-results
          path: merged-allure-results/
          retention-days: 30

      - name: 📤 Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-allure-report
          path: allure-report/
          retention-days: 30

      - name: 🌐 Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GB_OAUTH_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: deploy-validation/${{ github.run_number }}
          keep_files: true

      - name: 🌐 Deploy Latest Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GB_OAUTH_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: deploy-validation/latest
          keep_files: true

      - name: 🧹 Cleanup Remote
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.DEV_IP }} "
            cd ~/lynk-backend-automation &&
            docker-compose down --remove-orphans 2>/dev/null || true &&
            sudo chown -R \$USER:\$USER . 2>/dev/null || true &&
            rm -f /tmp/allure-report.tar.gz
          "

      - name: 📢 Send Slack Notification
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/lynk-backend/deploy-validation/${{ github.run_number }}/"
          LATEST_URL="https://${{ github.repository_owner }}.github.io/lynk-backend/deploy-validation/latest/"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl --insecure -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "${{ steps.test-results.outputs.status }} Regression Tests - Run #${{ github.run_number }}",
              "attachments": [{
                "color": "${{ steps.test-results.outputs.color }}",
                "title": "🧪 Regression Test Results",
                "title_link": "'"$REPORT_URL"'",
                "fields": [
                  {"title": "Status", "value": "${{ steps.test-results.outputs.status }}", "short": true},
                  {"title": "Branch", "value": "'"$GITHUB_REF_NAME"'", "short": true},
                  {"title": "Test Summary", "value": "Total: ${{ steps.test-results.outputs.total }}\n✅ Passed: ${{ steps.test-results.outputs.passed }}\n❌ Failed: ${{ steps.test-results.outputs.failed }}", "short": true},
                  {"title": "Triggered By", "value": "'"$GITHUB_ACTOR"'", "short": true}
                ],
                "actions": [
                  {"type": "button", "text": "📊 View Report", "url": "'"$REPORT_URL"'", "style": "primary"},
                  {"type": "button", "text": "📈 Latest", "url": "'"$LATEST_URL"'"},
                  {"type": "button", "text": "🔧 Workflow", "url": "'"$WORKFLOW_URL"'"}
                ],
                "footer": "Lynk Backend • Deploy Validation"
              }]
            }' ${{ secrets.SLACK_HOOK_URL }}

      - name: 📝 Create GitHub Summary
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/lynk-backend/deploy-validation/${{ github.run_number }}/"
          LATEST_URL="https://${{ github.repository_owner }}.github.io/lynk-backend/deploy-validation/latest/"

          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🧪 Regression Test Results

          ## Status: ${{ steps.test-results.outputs.status }}

          | Metric | Count |
          |--------|-------|
          | Total | ${{ steps.test-results.outputs.total }} |
          | ✅ Passed | ${{ steps.test-results.outputs.passed }} |
          | ❌ Failed | ${{ steps.test-results.outputs.failed }} |

          ## Reports
          - 📊 [This Run Report](REPORT_URL_PLACEHOLDER)
          - 📈 [Latest Report](LATEST_URL_PLACEHOLDER)

          ---
          EOF
          sed -i "s|REPORT_URL_PLACEHOLDER|$REPORT_URL|g" $GITHUB_STEP_SUMMARY
          sed -i "s|LATEST_URL_PLACEHOLDER|$LATEST_URL|g" $GITHUB_STEP_SUMMARY
