name: Deploy to Production (Docker)

on:
    workflow_dispatch:
    push:
        branches:
            - production

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-latest
        environment: production
        outputs:
            servers: ${{ steps.set-servers.outputs.servers }}
        steps:
            - name: Set server IPs from environment variable
              id: set-servers
              env:
                  SERVERS_JSON: ${{ vars.DEPLOYMENT_SERVER_IPS }}
              run: |
                  # Use env variable to avoid bash quote interpretation
                  echo "servers=$SERVERS_JSON" >> $GITHUB_OUTPUT

    build:
        runs-on: [self-hosted, production]
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: production

            - name: Write encrypted environment from secret
              run: |
                  echo "${{ secrets.ENV_ENCRYPTED_CONTENT }}" > .env.production.encrypted
                  if [ ! -f ".env.production.encrypted" ] || [ ! -s ".env.production.encrypted" ]; then
                    echo "❌ Error: Failed to write encrypted env file"
                    exit 1
                  fi
                  echo "✅ Encrypted environment file created"

            - name: Install composer dependencies
              run: composer install --no-dev --no-scripts --no-interaction --prefer-dist

            - name: Decrypt environment file
              env:
                  LARAVEL_ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
              run: |
                  php artisan env:decrypt --env=production --force
                  if [ ! -f ".env" ]; then
                    echo "❌ Failed to decrypt environment file"
                    exit 1
                  fi
                  echo "✅ Environment decrypted successfully"

            - name: Build PHP-FPM image
              run: |
                  docker build -t lynk-backend:${{ github.sha }}-prod \
                    -t lynk-backend:prod-latest \
                    -f docker/laravel/Dockerfile .

            - name: Save and compress Docker image
              run: |
                  # Save image to tar file
                  docker save lynk-backend:${{ github.sha }}-prod | gzip > /tmp/lynk-backend-prod.tar.gz

                  # Show compressed size
                  echo "Compressed image size:"
                  ls -lh /tmp/lynk-backend-prod.tar.gz

    deploy-server-1:
        needs: [build, setup]
        runs-on: [self-hosted, production]
        environment: production

        steps:
            - name: Checkout code (for docker-compose files)
              uses: actions/checkout@v4
              with:
                  ref: production

            - name: Get first server IP
              id: server
              run: |
                  SERVERS='${{ needs.setup.outputs.servers }}'
                  SERVER_1=$(echo $SERVERS | jq -r '.[0]')
                  echo "ip=$SERVER_1" >> $GITHUB_OUTPUT

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  # Write SSH key to file
                  echo "${{ secrets.DEPLOYMENT_KEY }}" > ~/.ssh/deployment_key
                  chmod 600 ~/.ssh/deployment_key

                  # Configure SSH with no host checking for simplicity
                  cat >> ~/.ssh/config <<EOF
                  Host *
                      IdentityFile ~/.ssh/deployment_key
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF

            - name: Transfer image and compose files to server 1
              run: |
                  # Transfer image
                  scp /tmp/lynk-backend-prod.tar.gz ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/

                  # Transfer docker-compose files
                  scp -r docker/compose ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/lynk-backend-compose/

                  echo "All files transferred to server 1"

            - name: Deploy on server 1 (Base + Scheduler + Group 1)
              run: |
                  ssh ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }} "
                    set -euo pipefail

                    # Load new image
                    echo '📦 Loading Docker image...'
                    gunzip -c /tmp/lynk-backend-prod.tar.gz | docker load
                    docker tag lynk-backend:${{ github.sha }}-prod app-php-fpm:prod-latest

                    # Clean up compressed file
                    rm -f /tmp/lynk-backend-prod.tar.gz

                    # Prepare deployment directory
                    sudo mkdir -p /var/www/lynk-backend/docker
                    cd /var/www/lynk-backend

                    # Copy docker-compose files
                    sudo cp -r /tmp/lynk-backend-compose/compose docker/
                    sudo rm -rf /tmp/lynk-backend-compose

                    # Run migrations (only on server 1)
                    echo '🗄️  Running database migrations...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan migrate --force

                    # Cache optimization
                    echo '⚡ Optimizing caches...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan config:cache

                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan route:cache

                    # Deploy server 1: Base + Scheduler + Worker Group 1
                    echo '🚀 Deploying server 1 services...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.scheduler.yml \
                      -f docker/compose/docker-compose.group1.yml \
                      up -d --force-recreate

                    # Wait for services to start
                    echo '⏳ Waiting for services to start...'
                    sleep 15

                    # Verify deployment
                    echo '✅ Verifying deployment...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.scheduler.yml \
                      -f docker/compose/docker-compose.group1.yml \
                      ps

                    echo '🎉 Server 1 deployment completed successfully'
                  "

    deploy-server-2:
        needs: [build, setup, deploy-server-1]
        runs-on: [self-hosted, production]
        environment: production

        steps:
            - name: Checkout code (for docker-compose files)
              uses: actions/checkout@v4
              with:
                  ref: production

            - name: Get second server IP
              id: server
              run: |
                  SERVERS='${{ needs.setup.outputs.servers }}'
                  SERVER_2=$(echo $SERVERS | jq -r '.[1]')
                  echo "ip=$SERVER_2" >> $GITHUB_OUTPUT

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  # Write SSH key to file
                  echo "${{ secrets.DEPLOYMENT_KEY }}" > ~/.ssh/deployment_key
                  chmod 600 ~/.ssh/deployment_key

                  # Configure SSH with no host checking for simplicity
                  cat >> ~/.ssh/config <<EOF
                  Host *
                      IdentityFile ~/.ssh/deployment_key
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF

            - name: Transfer image and compose files to server 2
              run: |
                  # Transfer image
                  scp /tmp/lynk-backend-prod.tar.gz ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/

                  # Transfer docker-compose files
                  scp -r docker/compose ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/lynk-backend-compose/

                  echo "All files transferred to server 2"

            - name: Deploy on server 2 (Base + Group 2)
              run: |
                  ssh ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }} "
                    set -euo pipefail

                    # Load new image
                    echo '📦 Loading Docker image...'
                    gunzip -c /tmp/lynk-backend-prod.tar.gz | docker load
                    docker tag lynk-backend:${{ github.sha }}-prod app-php-fpm:prod-latest

                    # Clean up compressed file
                    rm -f /tmp/lynk-backend-prod.tar.gz

                    # Prepare deployment directory
                    sudo mkdir -p /var/www/lynk-backend/docker
                    cd /var/www/lynk-backend

                    # Copy docker-compose files
                    sudo cp -r /tmp/lynk-backend-compose/compose docker/
                    sudo rm -rf /tmp/lynk-backend-compose

                    # Deploy server 2: Base + Worker Group 2
                    echo '🚀 Deploying server 2 services...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.group2.yml \
                      up -d --force-recreate

                    # Wait for services to start
                    echo '⏳ Waiting for services to start...'
                    sleep 15

                    # Verify deployment
                    echo '✅ Verifying deployment...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.group2.yml \
                      ps

                    echo '🎉 Server 2 deployment completed successfully'
                  "

    deploy-server-3:
        needs: [build, setup, deploy-server-2]
        runs-on: [self-hosted, production]
        environment: production

        steps:
            - name: Checkout code (for docker-compose files)
              uses: actions/checkout@v4
              with:
                  ref: production

            - name: Get third server IP
              id: server
              run: |
                  SERVERS='${{ needs.setup.outputs.servers }}'
                  SERVER_3=$(echo $SERVERS | jq -r '.[2]')
                  echo "ip=$SERVER_3" >> $GITHUB_OUTPUT

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  # Write SSH key to file
                  echo "${{ secrets.DEPLOYMENT_KEY }}" > ~/.ssh/deployment_key
                  chmod 600 ~/.ssh/deployment_key

                  # Configure SSH with no host checking for simplicity
                  cat >> ~/.ssh/config <<EOF
                  Host *
                      IdentityFile ~/.ssh/deployment_key
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF

            - name: Transfer image and compose files to server 3
              run: |
                  # Transfer image
                  scp /tmp/lynk-backend-prod.tar.gz ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/

                  # Transfer docker-compose files
                  scp -r docker/compose ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }}:/tmp/lynk-backend-compose/

                  echo "All files transferred to server 3"

            - name: Deploy on server 3 (Base + Group 3)
              run: |
                  ssh ${{ secrets.DEPLOYMENT_USER }}@${{ steps.server.outputs.ip }} "
                    set -euo pipefail

                    # Load new image
                    echo '📦 Loading Docker image...'
                    gunzip -c /tmp/lynk-backend-prod.tar.gz | docker load
                    docker tag lynk-backend:${{ github.sha }}-prod app-php-fpm:prod-latest

                    # Clean up compressed file
                    rm -f /tmp/lynk-backend-prod.tar.gz

                    # Prepare deployment directory
                    sudo mkdir -p /var/www/lynk-backend/docker
                    cd /var/www/lynk-backend

                    # Copy docker-compose files
                    sudo cp -r /tmp/lynk-backend-compose/compose docker/
                    sudo rm -rf /tmp/lynk-backend-compose

                    # Deploy server 3: Base + Worker Group 3
                    echo '🚀 Deploying server 3 services...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.group3.yml \
                      up -d --force-recreate

                    # Wait for services to start
                    echo '⏳ Waiting for services to start...'
                    sleep 15

                    # Verify deployment
                    echo '✅ Verifying deployment...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.group3.yml \
                      ps

                    echo '🎉 Server 3 deployment completed successfully'
                  "

            - name: Cleanup local image
              if: always()
              run: |
                  rm -f /tmp/lynk-backend-prod.tar.gz

    notify:
        needs: [deploy-server-1, deploy-server-2, deploy-server-3]
        if: always()
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Send Slack notification
              run: |
                  # Build PR URL if applicable
                  PR_URL="${{ github.event.pull_request.html_url }}"
                  if [ -z "$PR_URL" ]; then
                    PR_URL="N/A"
                  fi

                  DEPLOYMENT_STATUS="✅ SUCCESS"
                  if [ "${{ needs.deploy-server-1.result }}" != "success" ] || [ "${{ needs.deploy-server-2.result }}" != "success" ] || [ "${{ needs.deploy-server-3.result }}" != "success" ]; then
                    DEPLOYMENT_STATUS="❌ FAILED"
                  fi

                  echo "Repository Name: $GITHUB_REPOSITORY"
                  echo "Branch Name: $GITHUB_REF"
                  echo "PR URL: $PR_URL"
                  echo "Execution Time: $(date)"
                  echo "Deployment Status: $DEPLOYMENT_STATUS"
                  echo "Docker Image Tag: ${{ github.sha }}"

                  curl -X POST -H 'Content-type: application/json' --data '{
                    "text":"🐳 Backend Docker Deployment (Production)\n*Status:* '"$DEPLOYMENT_STATUS"'\n*Repository:* '"$GITHUB_REPOSITORY"'\n*Branch:* '"$GITHUB_REF"'\n*Image Tag:* '"${{ github.sha }}"'\n*Time:* '"$(date)"'\n*PR URL:* '"$PR_URL"'"
                  }' ${{ secrets.SLACK_HOOK_URL }}
