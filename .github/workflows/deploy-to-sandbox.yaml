name: deploy on sandbox

on:
  workflow_dispatch:
  push:
    branches:
      - sandbox

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        id: install-ssh-key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_SANDBOX_PRIVATE_KEY }}

      - name: pulling and build code
        id: pull-and-build
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SANDBOX_USER_NAME }}@144.24.208.157 \
           "cd /var/www/lynk-backend/ && sudo git pull origin sandbox && sudo composer install --no-interaction --prefer-dist --optimize-autoloader && sudo php artisan migrate && sudo supervisorctl stop all && sudo supervisorctl start all"

      - name: set pr url
        if: always()
        id: pr-url
        run: |
          echo "Fetching PR info for commit ${{ github.sha }}"
          PR_URL=$(curl -s -H "Accept: application/vnd.github.groot-preview+json" \
            -H "Authorization: token ${{ secrets.GB_OAUTH_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r 'if type == "array" and length > 0 then .[0].html_url else "" end')

          echo "pr-url=$PR_URL" >> $GITHUB_OUTPUT


      - name: print info
        if: always()
        run: |
          echo "Repository Name: $GITHUB_REPOSITORY"
          echo "Branch Name: $GITHUB_REF"
          echo "pr-url: ${{ steps.pr-url.outputs.url }}"
          echo "Execution Time: $(date)"
          echo "Workflow Status: ${{ job.status }}"

          curl --insecure -X POST -H 'Content-type: application/json' --data '{"text":"Repository Name: '"$GITHUB_REPOSITORY"'\nBranch Name: '"$GITHUB_REF"'\nExecution Time: '"$(date)"'\nWorkflow Status: '"${{ job.status }}"'\n pull request URL: '"${{ steps.pr-url.outputs.url }}"'"}' ${{ secrets.SLACK_HOOK_URL }}
