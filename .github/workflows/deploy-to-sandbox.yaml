name: Deploy to Sandbox (Docker)

on:
    workflow_dispatch:
    push:
        branches:
            - sandbox

concurrency:
    group: deploy-sandbox
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-latest
        environment: sandbox
        outputs:
            servers: ${{ steps.set-servers.outputs.servers }}
        steps:
            - name: Set server IPs from environment variable
              id: set-servers
              env:
                  SERVERS_JSON: ${{ vars.DEPLOYMENT_SERVER_IPS }}
              run: |
                  # Use env variable to avoid bash quote interpretation
                  echo "servers=$SERVERS_JSON" >> $GITHUB_OUTPUT

    build:
        runs-on: ubuntu-latest
        environment: sandbox

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build PHP-FPM image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/laravel/Dockerfile
                  load: true
                  tags: lynk-backend:${{ github.sha }}-sandbox
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Save and compress Docker image
              run: |
                  # Save image to tar file
                  docker save lynk-backend:${{ github.sha }}-sandbox | gzip > /tmp/lynk-backend-sandbox.tar.gz

                  # Show compressed size
                  echo "Compressed image size:"
                  ls -lh /tmp/lynk-backend-sandbox.tar.gz

            - name: Upload Docker image as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docker-image-sandbox
                  path: /tmp/lynk-backend-sandbox.tar.gz
                  retention-days: 1

    deploy:
        needs: [build, setup]
        runs-on: ubuntu-latest
        environment: sandbox
        strategy:
            matrix:
                # Get servers from the setup job output
                # DEPLOYMENT_SERVER_IPS must be a JSON array: ["10.0.0.1"]
                server: ${{ fromJson(needs.setup.outputs.servers) }}
            fail-fast: false

        steps:
            - name: Checkout code (for docker-compose files)
              uses: actions/checkout@v4

            - name: Download Docker image
              uses: actions/download-artifact@v4
              with:
                  name: docker-image-sandbox
                  path: /tmp/

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  # Write SSH key to file
                  echo "${{ secrets.DEPLOYMENT_KEY }}" > ~/.ssh/deployment_key
                  chmod 600 ~/.ssh/deployment_key

                  # Configure SSH with no host checking for simplicity
                  cat >> ~/.ssh/config <<EOF
                  Host *
                      IdentityFile ~/.ssh/deployment_key
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF

            - name: Transfer image and compose files to server ${{ matrix.server }}
              run: |
                  # Transfer image
                  scp /tmp/lynk-backend-sandbox.tar.gz ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }}:/tmp/

                  # Transfer docker-compose files
                  scp -r docker/compose ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }}:/tmp/lynk-backend-compose/

                  echo "All files transferred to ${{ matrix.server }}"

            - name: Deploy Docker containers on server ${{ matrix.server }}
              run: |
                  ssh ${{ secrets.DEPLOYMENT_USER }}@${{ matrix.server }} "
                    set -euo pipefail

                    # Load new image
                    echo 'Loading Docker image...'
                    gunzip -c /tmp/lynk-backend-sandbox.tar.gz | docker load
                    docker tag lynk-backend:${{ github.sha }}-sandbox app-php-fpm:sandbox-latest

                    # Clean up compressed file
                    rm -f /tmp/lynk-backend-sandbox.tar.gz

                    # Navigate to application directory
                    cd /var/www/lynk-backend || exit 1

                    # Pull latest code
                    echo 'Pulling latest code...'
                    sudo git fetch origin
                    sudo git checkout sandbox
                    sudo git pull origin sandbox

                    # Copy docker-compose files from temp
                    sudo cp -r /tmp/lynk-backend-compose/compose docker/
                    sudo rm -rf /tmp/lynk-backend-compose

                    # Run migrations before deploying
                    echo 'Running database migrations...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan migrate --force

                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan structure:clear

                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan structure:discover

                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan config:cache

                    docker compose -f docker/compose/docker-compose.web.yml \
                      run --rm app php artisan route:cache

                    # Deploy all services (single server gets everything)
                    echo 'Deploying all services...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.scheduler.yml \
                      -f docker/compose/docker-compose.group1.yml \
                      -f docker/compose/docker-compose.group2.yml \
                      -f docker/compose/docker-compose.group3.yml \
                      up -d --force-recreate

                    # Wait for services to start
                    echo 'Waiting for services to start...'
                    sleep 15

                    # Verify deployment
                    echo 'Verifying deployment...'
                    docker compose -f docker/compose/docker-compose.web.yml \
                      -f docker/compose/docker-compose.scheduler.yml \
                      -f docker/compose/docker-compose.group1.yml \
                      -f docker/compose/docker-compose.group2.yml \
                      -f docker/compose/docker-compose.group3.yml \
                      ps

                    echo 'Deployment completed successfully'
                  "

    notify:
        needs: deploy
        if: always()
        runs-on: ubuntu-latest
        environment: sandbox

        steps:
            - name: Send Slack notification
              run: |
                  # Build PR URL if applicable
                  PR_URL="${{ github.event.pull_request.html_url }}"
                  if [ -z "$PR_URL" ]; then
                    PR_URL="N/A"
                  fi

                  echo "Repository Name: $GITHUB_REPOSITORY"
                  echo "Branch Name: $GITHUB_REF"
                  echo "PR URL: $PR_URL"
                  echo "Execution Time: $(date)"
                  echo "Workflow Status: ${{ needs.deploy.result }}"
                  echo "Docker Image Tag: ${{ github.sha }}"

                  curl -X POST -H 'Content-type: application/json' --data '{
                    "text":"🐳 Backend Docker Deployment (Sandbox)\nRepository: '"$GITHUB_REPOSITORY"'\nBranch: '"$GITHUB_REF"'\nImage Tag: '"${{ github.sha }}"'\nTime: '"$(date)"'\nStatus: '"${{ needs.deploy.result }}"'\nPR: '"$PR_URL"'"
                  }' ${{ secrets.SLACK_HOOK_URL }}
