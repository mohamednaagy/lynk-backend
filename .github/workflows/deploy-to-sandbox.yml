name: Deployment to Sandbox

on:
  push:
    branches:
      - sandbox
  pull_request:
    types:
      - closed
    branches:
      - sandbox

jobs:
  deploy_to_sandbox:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
  
      - name: Deploy code
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "cd /var/www/lynk-backend && sudo git pull && sudo composer install --no-interaction --optimize-autoloader && sudo php artisan migrate --no-interaction --force && sudo supervisorctl restart all"